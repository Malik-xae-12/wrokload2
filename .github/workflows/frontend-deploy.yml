name: accelerator-frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'workload/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build Frontend & Fabric Workload SDK
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          echo "=== 1. Building Accelerator Frontend React App ==="
          cd frontend
          npm install --no-audit --no-fund
          npm run build
          
          echo "=== 2. Building Microsoft Fabric Workload SDK ==="
          cd ../workload
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build:prod
          
          echo "=== 3. Merging Frontend and Workload SDK ==="
          mkdir -p ../build/Frontend/app
          cp -r ../frontend/dist/* ../build/Frontend/app/
          cp ../frontend/startup.sh ../build/Frontend/startup.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/Frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - name: Verify files
        run: ls -la dist

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: fabric-solution-accelerator
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_UI }}
          package: dist